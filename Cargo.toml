[package]
name = "io-maildir"
description = "Maildir client library"
version = "0.0.1"
authors = ["soywod <pimalaya.org@posteo.net>"]
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
categories = ["email", "filesystem"]
keywords = ["email", "maildir", "client", "io-free"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-maildir/latest/io_maildir"
repository = "https://github.com/pimalaya/io-maildir"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client"]
client = ["dep:gethostname"]
parser = ["dep:mail-parser"]
serde = ["mail-parser?/serde"]

[[example]]
name = "std_store_message"
required-features = ["client"]

[dev-dependencies]
env_logger = "0.11"
tempfile = "3.20"

[dependencies]
gethostname = { version = "1", optional = true }
log = "0.4"
mail-parser = { version = "0.11", optional = true }
thiserror = "2"
